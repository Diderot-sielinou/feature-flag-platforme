# =============================================================================
# LaunchLayer — Nginx reverse proxy
# =============================================================================
# Replace YOUR_DOMAIN with your actual domain (e.g., api.launchlayer.io)
#
# Initial setup (HTTP only, for Certbot):
#   1. Deploy with this config as-is
#   2. Run: docker compose exec certbot certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN
#   3. Uncomment the SSL server block below
#   4. docker compose exec nginx nginx -s reload
# =============================================================================

upstream api_management {
    server api-management:3000;
}

upstream api_read {
    server api-read:3001;
}

# HTTP — redirect to HTTPS (or serve Certbot challenges)
server {
    listen 80;
    server_name _;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Once SSL is set up, uncomment this to force redirect:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # =========================================================================
    # Temporary HTTP routing (remove after SSL setup)
    # =========================================================================

    # Management API
    location /api/v1/management/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://api_management;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clerk webhooks (no rate limit — Clerk retries on failure)
    location /api/v1/management/auth/webhooks/ {
        proxy_pass http://api_management;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Evaluation API (higher rate limit)
    location /api/v1/eval/ {
        limit_req zone=eval burst=50 nodelay;

        proxy_pass http://api_read;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint (long-lived connections)
    location /api/v1/eval/flags/stream {
        proxy_pass http://api_read;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Health checks (no rate limit)
    location /api/v1/management/health {
        proxy_pass http://api_management;
    }

    location /api/v1/eval/health {
        proxy_pass http://api_read;
    }
}

