name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # RELEASE SDK
  # ===========================================================================
  release-sdk:
    name: Release SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=@launchlayer/sdk-js

      - name: Test SDK
        run: npm run test --workspace=@launchlayer/sdk-js

      - name: Get current version
        id: current-version
        working-directory: packages/sdk-js
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump-version
        working-directory: packages/sdk-js
        run: |
          VERSION_TYPE="${{ github.event.inputs.version || 'patch' }}"
          npm version $VERSION_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git add .
          git commit -m "chore(release): sdk v${{ steps.bump-version.outputs.new_version }}" || true
          git tag "sdk-v${{ steps.bump-version.outputs.new_version }}"
          git push origin main --tags

      - name: Publish to npm
        working-directory: packages/sdk-js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `sdk-v${{ steps.bump-version.outputs.new_version }}`,
              name: `SDK v${{ steps.bump-version.outputs.new_version }}`,
              body: `## @launchlayer/sdk-js v${{ steps.bump-version.outputs.new_version }}

### Installation
\`\`\`bash
npm install @launchlayer/sdk-js@${{ steps.bump-version.outputs.new_version }}
\`\`\`

### Changes
See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/packages/sdk-js/CHANGELOG.md)
              `,
              draft: false,
              prerelease: false
            });
            console.log(`Created release: ${release.html_url}`);

  # ===========================================================================
  # CREATE RELEASE NOTES
  # ===========================================================================
  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [release-sdk]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.1.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print changelog
        run: echo "${{ steps.changelog.outputs.changelog }}"
