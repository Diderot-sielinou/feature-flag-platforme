name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  HUSKY: '0'
  CI: 'true'

jobs:
  # ===========================================================================
  # LINT & TYPE CHECK
  # ===========================================================================

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build shared packages in order
        run: |
          echo "📦 Building @repo/shared..."
          npx turbo run build --filter=@repo/shared --force

           echo "📦 Building @repo/database..."
          npx turbo run build --filter=@repo/database --force

          echo "📦 Building @repo/sdk..."
          npx turbo run build --filter=@repo/sdk --force

      - name: Verify outputs exist
        run: |
          echo "🔍 Verifying build outputs..."
          test -f packages/shared/dist/index.js || (echo "❌ @repo/shared build failed" && exit 1)
          test -f packages/shared/dist/index.d.ts || (echo "❌ @repo/shared types missing" && exit 1)
          test -f packages/database/dist/index.js || (echo "❌ @repo/database build failed" && exit 1)
          test -f packages/database/dist/index.d.ts || (echo "❌ @repo/database types missing" && exit 1)
          echo "✅ All shared packages built successfully"

      - name: Build all packages
        run: npm run build

      - name: Lint
        run: npm run lint

  # ===========================================================================
  # UNIT TESTS
  # ===========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featureflags_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/featureflags_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-for-ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Clean build artifacts
        run: |
          find . -name "tsconfig.tsbuildinfo" -type f -delete
          find . -type d -name "dist" -not -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true

      - name: Build shared packages first
        run: |
          npx turbo run build --filter=@repo/shared --filter=@repo/database --filter=@repo/sdk

      - name: Build all packages
        run: npm run build

      - name: Run migrations
        run: npm run db:migrate:dev

      # - name: Run tests
      #   run: npm test -- --coverage

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4.0.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # BUILD
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build shared packages first
        run: |
          npx turbo run build --filter=@repo/shared --filter=@repo/database --filter=@repo/sdk

      - name: Verify shared packages outputs
        run: |
          echo "🔍 Checking if dist folders exist..."
          ls -la packages/shared/ || echo "⚠️  shared package not found"
          ls -la packages/shared/dist/ || echo "❌ shared/dist not found"
          ls -la packages/database/ || echo "⚠️  database package not found"
          ls -la packages/database/dist/ || echo "❌ database/dist not found"
          ls -la packages/sdk/ || echo "⚠️  sdk package not found"
          ls -la packages/sdk/dist/ || echo "❌ sdk/dist not found"

      - name: Build all packages
        run: npm run build

      - name: Verify builds
        run: |
          echo "✅ Checking build outputs..."
          test -f apps/api-management/dist/main.js || exit 1
          test -f apps/api-read/dist/main.js || exit 1
          test -f packages/shared/dist/index.js || exit 1
          test -f packages/shared/dist/index.d.ts || exit 1
          test -f packages/database/dist/index.js || exit 1
          echo "✅ All builds successful!"
