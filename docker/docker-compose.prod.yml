version: '3.8'

# =============================================================================
# Docker Compose — Production (VPS)
# Usage: docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================

services:
  # ===========================================================================
  # Nginx Reverse Proxy + SSL (Certbot)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: ff-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api-management:
        condition: service_healthy
      api-read:
        condition: service_healthy
    networks:
      - ff-network
    restart: always

  # ===========================================================================
  # Certbot (auto-renew SSL)
  # ===========================================================================
  certbot:
    image: certbot/certbot
    container_name: ff-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renouvellement auto toutes les 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - ff-network
    restart: always

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ff-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-featureflags}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ff-network
    restart: always
    # No port exposed — only accessible within Docker network

  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ff-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ff-network
    restart: always
    # No port exposed — only accessible within Docker network

  # ===========================================================================
  # API Management (Write API)
  # ===========================================================================
  api-management:
    build:
      context: ..
      dockerfile: docker/api-management.Dockerfile
    container_name: ff-api-management
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-featureflags}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Providers
      MESSAGING_PROVIDER: redis
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Clerk
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      # App URLs
      DASHBOARD_URL: ${DASHBOARD_URL}
      API_URL: ${API_URL}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@launchlayer.io}
      # JWT fallback
      JWT_SECRET: ${JWT_SECRET}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ff-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # API Read (Evaluation API)
  # ===========================================================================
  api-read:
    build:
      context: ..
      dockerfile: docker/api-read.Dockerfile
    container_name: ff-api-read
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-featureflags}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MESSAGING_PROVIDER: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ff-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  certbot_certs:

networks:
  ff-network:
    driver: bridge
