name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: feature-flags-cluster

jobs:
  # ============================================
  # JOB 1 : Tests & Linting
  # ============================================
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffuser
          POSTGRES_PASSWORD: ffpassword
          POSTGRES_DB: featureflags
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd packages/database
          npm run db:generate

      - name: Run migrations (test DB)
        run: |
          cd packages/database
          npm run db:push
        env:
          DATABASE_URL: postgresql://ffuser:ffpassword@localhost:5432/featureflags

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://ffuser:ffpassword@localhost:5432/featureflags
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ============================================
  # JOB 2 : Build & Push Docker Images
  # ============================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push Management API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
        run: |
          docker build \
            -t $ECR_REGISTRY/feature-flags/api-management:$IMAGE_TAG \
            -t $ECR_REGISTRY/feature-flags/api-management:latest \
            -f docker/api-management.Dockerfile \
            .

          docker push $ECR_REGISTRY/feature-flags/api-management:$IMAGE_TAG
          docker push $ECR_REGISTRY/feature-flags/api-management:latest

      - name: Build and push Read API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
        run: |
          docker build \
            -t $ECR_REGISTRY/feature-flags/api-read:$IMAGE_TAG \
            -t $ECR_REGISTRY/feature-flags/api-read:latest \
            -f docker/api-read.Dockerfile \
            .

          docker push $ECR_REGISTRY/feature-flags/api-read:$IMAGE_TAG
          docker push $ECR_REGISTRY/feature-flags/api-read:latest

  # ============================================
  # JOB 3 : Database Migration
  # ============================================
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve DB credentials
        id: db-creds
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.DB_SECRET_ARN }}" \
            --query SecretString \
            --output text)

          USERNAME=$(echo $SECRET_JSON | jq -r '.username')
          PASSWORD=$(echo $SECRET_JSON | jq -r '.password')

          DATABASE_URL="postgresql://${USERNAME}:${PASSWORD}@${{ vars.RDS_ENDPOINT }}:5432/featureflags?schema=public"

          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
          echo "✅ Database URL constructed"

      - name: Run Prisma migrations via ECS Task
        run: |
          echo "🚀 Launching migration task..."

          # Récupérer la Task Definition ARN
          TASK_DEF_ARN=$(aws ecs list-task-definitions \
            --family-prefix FeatureFlagsComputeStack-ManagementTaskDef \
            --status ACTIVE \
            --sort DESC \
            --max-items 1 \
            --query 'taskDefinitionArns[0]' \
            --output text)

          echo "Using Task Definition: $TASK_DEF_ARN"

          # Lancer la tâche avec override de commande
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.CLUSTER_NAME }} \
            --task-definition $TASK_DEF_ARN \
            --launch-type FARGATE \
            --count 1 \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ vars.VPC_SUBNET_IDS }}],
              securityGroups=[${{ vars.APP_SECURITY_GROUP_ID }}],
              assignPublicIp=DISABLED
            }" \
            --overrides '{
              "containerOverrides": [{
                "name": "management-service",
                "command": ["sh", "-c", "cd packages/database && npm run db:migrate:prod"],
                "environment": [
                  {"name": "DATABASE_URL", "value": "${{ env.DATABASE_URL }}"}
                ]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" == "None" ]; then
            echo "❌ Failed to launch migration task"
            exit 1
          fi

          echo "✅ Migration task launched: $TASK_ARN"

          # Attendre la fin de la tâche
          echo "⏳ Waiting for migration to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.CLUSTER_NAME }} \
            --tasks $TASK_ARN

          # Vérifier le statut final
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.CLUSTER_NAME }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed with exit code: $EXIT_CODE"
            exit 1
          fi

          echo "✅ Database migration completed successfully"

  # ============================================
  # JOB 4 : Deploy to ECS
  # ============================================
  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: migrate-database
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve Service Names
        id: service-names
        run: |
          MGNT_SVC_NAME=$(aws cloudformation describe-stacks \
            --stack-name FeatureFlagsComputeStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ManagementServiceName`].OutputValue' \
            --output text)

          READ_SVC_NAME=$(aws cloudformation describe-stacks \
            --stack-name FeatureFlagsComputeStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ReadServiceName`].OutputValue' \
            --output text)
            
          echo "MANAGEMENT_SERVICE_NAME=$MGNT_SVC_NAME" >> $GITHUB_ENV
          echo "READ_SERVICE_NAME=$READ_SVC_NAME" >> $GITHUB_ENV

      - name: Force new deployment - Management Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service ${{ env.MANAGEMENT_SERVICE_NAME }}\
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

          echo "✅ Management service deployment triggered"

      - name: Force new deployment - Read Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service ${{ env.READ_SERVICE_NAME }} \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

          echo "✅ Read service deployment triggered"

      - name: Wait for stable deployment
        run: |
          echo "⏳ Waiting for services to stabilize (max 10 minutes)..."

          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.MANAGEMENT_SERVICE_NAME }} ${{ env.READ_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --cli-read-timeout 600 \
            --cli-connect-timeout 600

          echo "✅ All services are stable"

      - name: Verify deployment
        run: |
          # Récupérer l'ALB DNS
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name FeatureFlagsComputeStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDNSName`].OutputValue' \
            --output text)

          echo "🔍 Testing endpoints on: $ALB_DNS"

          # Test Management API
          if curl -f -m 10 "http://${ALB_DNS}/api/v1/management/health"; then
            echo "✅ Management API is healthy"
          else
            echo "⚠️ Management API health check failed (may take a few minutes to warm up)"
          fi

          # Test Read API
          if curl -f -m 10 "http://${ALB_DNS}/api/v1/eval"; then
            echo "✅ Read API is responding"
          else
            echo "⚠️ Read API not yet responsive"
          fi

  # ============================================
  # JOB 5 : Notification (optionnel)
  # ============================================
  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy-ecs
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-ecs.result }}" == "success" ]; then
            echo "✅ Deployment succeeded!"
            echo "🚀 Feature Flags Platform is now live"
          else
            echo "❌ Deployment failed"
            echo "Check the logs above for details"
            exit 1
          fi
