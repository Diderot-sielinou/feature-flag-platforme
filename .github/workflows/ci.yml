name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffuser
          POSTGRES_PASSWORD: ffpassword
          POSTGRES_DB: featureflags
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd packages/database && npm run db:generate

      - name: Run migrations
        run: cd packages/database && npm run db:push
        env:
          DATABASE_URL: postgresql://ffuser:ffpassword@localhost:5432/featureflags

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://ffuser:ffpassword@localhost:5432/featureflags
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-images:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Management API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/feature-flags/api-management:$IMAGE_TAG \
            -t $ECR_REGISTRY/feature-flags/api-management:latest \
            -f docker/api-management.Dockerfile .
          docker push $ECR_REGISTRY/feature-flags/api-management:$IMAGE_TAG
          docker push $ECR_REGISTRY/feature-flags/api-management:latest

      - name: Build and push Read API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/feature-flags/api-read:$IMAGE_TAG \
            -t $ECR_REGISTRY/feature-flags/api-read:latest \
            -f docker/api-read.Dockerfile .
          docker push $ECR_REGISTRY/feature-flags/api-read:$IMAGE_TAG
          docker push $ECR_REGISTRY/feature-flags/api-read:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update ECS services
        run: |
          aws ecs update-service --cluster feature-flags-cluster \
            --service management-service --force-new-deployment
          aws ecs update-service --cluster feature-flags-cluster \
            --service read-service --force-new-deployment
