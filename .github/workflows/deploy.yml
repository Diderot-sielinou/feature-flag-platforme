name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # BUILD, DEPLOY & MIGRATE on VPS via SSH
  # ===========================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/launchlayer

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "🏗️ Building Docker images..."
            docker compose -f docker/docker-compose.prod.yml --env-file .env.production build

            echo "🗄️ Running database migrations..."
            docker compose -f docker/docker-compose.prod.yml --env-file .env.production run --rm \
              api-management sh -c "cd /app/packages/database && npx prisma migrate deploy"

            echo "🚀 Restarting services..."
            docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d

            echo "⏳ Waiting for services to be healthy..."
            sleep 10

            echo "🔍 Health checks..."
            curl -sf http://localhost:3000/api/v1/management/health || (echo "❌ API Management unhealthy" && exit 1)
            curl -sf http://localhost:3001/api/v1/eval/health || (echo "❌ API Read unhealthy" && exit 1)

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"

      - name: Verify deployment
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://${{ secrets.VPS_HOST }}/api/v1/management/health" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Production health check passed"
          else
            echo "⚠️ External health check returned HTTP $HTTP_CODE (may need DNS/SSL setup)"
          fi
