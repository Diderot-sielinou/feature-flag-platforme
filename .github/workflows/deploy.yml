name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NODE_VERSION: '20'
  ECR_REGISTRY:
    ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com

jobs:
  # ===========================================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push API Management
      - name: Build and push API Management
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/api-management.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/feature-flags/api-management:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/feature-flags/api-management:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/feature-flags/api-management:latest
          cache-to:
            type=registry,ref=${{ env.ECR_REGISTRY }}/feature-flags/api-management:cache,mode=max

      # Build & Push API Read
      - name: Build and push API Read
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/api-read.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/feature-flags/api-read:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/feature-flags/api-read:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/feature-flags/api-read:latest
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/feature-flags/api-read:cache,mode=max

  # ===========================================================================
  # DEPLOY INFRASTRUCTURE & MIGRATIONS
  # ===========================================================================
  cdk-deploy:
    name: CDK & Migration
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      id-token: write
      contents: read
    outputs:
      migration-task-family: ${{ steps.cdk_deploy.outputs.migration_task_family }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy CDK Stack
      - name: Deploy FeatureFlagsComputeStack and Get Outputs
        id: cdk_deploy
        run: |
          cd infrastructure
          npx cdk deploy FeatureFlagsComputeStack \
            --require-approval never \
            --outputs-file cdk-outputs.json

          # Récupère le nom de la Task Definition Family
          TASK_DEF_FAMILY=$(jq -r '.FeatureFlagsComputeStack.MigrationTaskDefFamily // "feature-flags-migration"' cdk-outputs.json)
          echo "migration_task_family=$TASK_DEF_FAMILY" >> $GITHUB_OUTPUT
          echo "Migration Task Definition Family: $TASK_DEF_FAMILY"

      # Run Database Migrations
      - name: Run migration task
        env:
          MIGRATION_TASK_DEF_FAMILY: ${{ steps.cdk_deploy.outputs.migration_task_family }}
        run: |
          echo "Migration Task Definition Family: $MIGRATION_TASK_DEF_FAMILY"

          # Validation de la Task Definition Family
          if [ -z "$MIGRATION_TASK_DEF_FAMILY" ] || [ "$MIGRATION_TASK_DEF_FAMILY" == "null" ]; then
            echo "❌ Erreur: Task Definition Family non trouvée"
            MIGRATION_TASK_DEF_FAMILY="feature-flags-migration"
            echo "Utilisation de la valeur par défaut: $MIGRATION_TASK_DEF_FAMILY"
          fi

          # Récupération des subnet IDs depuis CloudFormation
          SUBNET_IDS=$(aws cloudformation describe-stacks \
            --stack-name FeatureFlagsNetworkStack \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`PrivateSubnets`].OutputValue' \
            --output text)

          # Récupération du Security Group ID depuis CloudFormation
          SG_ID=$(aws cloudformation describe-stacks \
            --stack-name FeatureFlagsNetworkStack \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?contains(OutputKey, `AppSG`)].OutputValue' \
            --output text | head -n1)

          echo "Using Subnets: $SUBNET_IDS"
          echo "Using Security Group: $SG_ID"

          # Validation
          if [ -z "$SUBNET_IDS" ] || [ -z "$SG_ID" ]; then
            echo "❌ Erreur: Subnets ou Security Group non trouvés"
            exit 1
          fi

          # Lancement de la tâche de migration
          TASK_ARN=$(aws ecs run-task \
            --cluster feature-flags-cluster \
            --task-definition $MIGRATION_TASK_DEF_FAMILY \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_ID],assignPublicIp=DISABLED}" \
            --overrides '{
              "containerOverrides": [{
                "name": "migration",
                "command": ["sh", "/app/packages/database/migrate.sh"]
              }]
            }' \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" == "None" ]; then
            echo "❌ Erreur: Impossible de lancer la tâche de migration"
            exit 1
          fi

          echo "✅ Tâche de migration lancée: $TASK_ARN"
          echo "Attente de la fin de la migration..."

          # Attendre la fin de la tâche
          aws ecs wait tasks-stopped \
            --cluster feature-flags-cluster \
            --tasks $TASK_ARN \
            --region ${{ env.AWS_REGION }}

          # Vérifier le code de sortie
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster feature-flags-cluster \
            --tasks $TASK_ARN \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration échouée avec le code: $EXIT_CODE"
            echo "Récupération des logs..."
            aws logs tail /ecs/feature-flags/migration \
              --since 1h \
              --region ${{ env.AWS_REGION }} || true
            exit 1
          fi

          echo "✅ Migration terminée avec succès"

  # ===========================================================================
  # UPDATE ECS SERVICES AND HEALTH CHECK
  # ===========================================================================
  deploy-services:
    name: Update ECS Services & Check
    runs-on: ubuntu-latest
    needs: [build-and-push, cdk-deploy]
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Force new deployment avec la nouvelle image
      - name: Update ECS Services - Force New Deployment
        run: |
          aws ecs update-service \
            --cluster feature-flags-cluster \
            --service feature-flags-management \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          aws ecs update-service \
            --cluster feature-flags-cluster \
            --service feature-flags-read \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for services to stabilize
        run: |
          echo "⏳ Attente de la stabilisation du service Management..."
          aws ecs wait services-stable \
            --cluster feature-flags-cluster \
            --services feature-flags-management \
            --region ${{ env.AWS_REGION }}

          echo "⏳ Attente de la stabilisation du service Read..."
          aws ecs wait services-stable \
            --cluster feature-flags-cluster \
            --services feature-flags-read \
            --region ${{ env.AWS_REGION }}

          echo "✅ Services stabilisés"

      - name: Get ALB URL
        id: get-url
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name FeatureFlagsComputeStack \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDNSName`].OutputValue' \
            --output text)

          echo "url=http://$ALB_DNS" >> $GITHUB_OUTPUT
          echo "ALB URL: http://$ALB_DNS"

      # Health Check
      - name: Health check
        run: |
          URL="${{ steps.get-url.outputs.url }}/api/v1/management/health"
          MAX_RETRIES=15 
          RETRY_COUNT=0

          echo "🔍 Démarrage du Health Check sur $URL"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP 200) for $URL!"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Health check failed (HTTP $HTTP_CODE), retrying in 20s... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 20
          done

          echo "❌ Health check failed after $MAX_RETRIES retries for $URL"
          exit 1

  # ===========================================================================
  # NOTIFY
  # ===========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-services]
    if: always()
    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ needs.deploy-services.result == 'success' && '✅' || '❌' }} LaunchLayer deployment to ${{ github.event.inputs.environment || 'staging' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy-services.result == 'success' && '✅ Deployment successful!' || '❌ Deployment failed!' }}\n*Environment:* ${{ github.event.inputs.environment || 'staging' }}\n*Service:* LaunchLayer ECS\n*Commit:* `${{ github.sha }}`\n*Branch:* ${{ github.ref_name }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
