name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffuser
          POSTGRES_PASSWORD: ffpassword
          POSTGRES_DB: featureflags
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd packages/database && npm run db:generate

      - name: Run migrations
        run: cd packages/database && npm run db:push
        env:
          DATABASE_URL: postgresql://ffuser:ffpassword@localhost:5432/featureflags

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://ffuser:ffpassword@localhost:5432/featureflags
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-images:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Management API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/feature-flags/api-management:$IMAGE_TAG \
            -t $ECR_REGISTRY/feature-flags/api-management:latest \
            -f docker/api-management.Dockerfile .
          docker push $ECR_REGISTRY/feature-flags/api-management:$IMAGE_TAG
          docker push $ECR_REGISTRY/feature-flags/api-management:latest

      - name: Build and push Read API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/feature-flags/api-read:$IMAGE_TAG \
            -t $ECR_REGISTRY/feature-flags/api-read:latest \
            -f docker/api-read.Dockerfile .
          docker push $ECR_REGISTRY/feature-flags/api-read:$IMAGE_TAG
          docker push $ECR_REGISTRY/feature-flags/api-read:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'

    env:
      DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
      RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }} # Utilisez vars. ou secrets. selon où vous le stockez
      VPC_SUBNET_IDS: ${{ secrets.VPC_SUBNET_IDS }}
      APP_SECURITY_GROUP_ID: ${{ secrets.APP_SECURITY_GROUP_ID }}
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # PHASE 1 : Préparation de la Migration
      # --------------------------------------------------
      - name: Retrieve DB Credentials from Secret Manager
        id: db-credentials
        run: |
          # Récupère le JSON du secret
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${{ env.DB_SECRET_ARN }}" \
            --query SecretString \
            --output text)
            
          # Extrait l'utilisateur et le mot de passe
          USERNAME=$(echo $SECRET_JSON | jq -r '.username')
          PASSWORD=$(echo $SECRET_JSON | jq -r '.password')
          DBNAME="featureflags" # Nom de base de données défini dans la stack
          PORT="5432"

          # Construit le DATABASE_URL complet
          DATABASE_URL="postgresql://${USERNAME}:${PASSWORD}@${{ env.RDS_ENDPOINT }}:${PORT}/${DBNAME}?schema=public"

          # Exporte le DATABASE_URL pour l'utiliser dans les étapes suivantes
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
          echo "Migration URL construite avec succès."
        shell: bash
        # NÉCESSITE LE PACKAGE `jq` pour traiter le JSON (installé par défaut sur Ubuntu-latest)

      # --------------------------------------------------
      # PHASE 2 : Exécution de la Migration via Tâche ECS
      # --------------------------------------------------
      - name: Run Prisma Migration on RDS using Fargate Task
        id: migration-task
        run: |
          # Le nom de la Task Definition est le nom de la Stack + le nom de la ressource.
          # Nous utiliserons le ManagementService Task Definition comme template.
          TASK_DEF_FAMILY="FeatureFlagsComputeStack-ManagementTaskDefinition"

          echo "Lancement de la migration Fargate..."

          # 1. Lancer la tâche Fargate de migration
          TASK_ARN=$(aws ecs run-task \
            --cluster feature-flags-cluster \
            --task-definition ${TASK_DEF_FAMILY} \
            --launch-type FARGATE \
            --count 1 \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[${{ env.VPC_SUBNET_IDS }}],securityGroups=[${{ env.APP_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{
                "containerOverrides": [
                    {
                        "name": "management-service", 
                        "command": ["sh", "-c", "npm install && npm --workspace=@repo/database run db:migrate:prod"], 
                        "environment": [
                            {"name": "DATABASE_URL", "value": "${{ env.DATABASE_URL }}"}
                        ]
                    }
                ]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ "$TASK_ARN" == "None" ] || [ -z "$TASK_ARN" ]; then
            echo "::error::Échec du lancement de la tâche de migration ECS."
            exit 1
          fi

          echo "Tâche de migration $TASK_ARN lancée."

          # 2. Attendre que la tâche se termine (succès ou échec)
          # Utilisation de la commande 'wait' ECS
          aws ecs wait tasks-stopped \
            --cluster feature-flags-cluster \
            --tasks $TASK_ARN
            
          # 3. Vérifier le statut d'arrêt
          TASK_STATUS=$(aws ecs describe-tasks \
            --cluster feature-flags-cluster \
            --tasks $TASK_ARN \
            --query 'tasks[0].stoppedReason' \
            --output text)

          if [[ "$TASK_STATUS" == "Essential container in task exited" ]]; then
              echo "::error::La migration a échoué. Cause: $TASK_STATUS. Vérifiez les logs de la tâche $TASK_ARN."
              exit 1
          fi

          echo "🎉 Migration de base de données terminée avec succès."
        shell: bash

      # --------------------------------------------------
      # PHASE 3 : Déploiement des Services API
      # --------------------------------------------------
      - name: Deploy new images to ECS
        run: |
          # Les services ECS peuvent maintenant démarrer avec la certitude que 
          # le schéma de la base de données est à jour.

          aws ecs update-service --cluster feature-flags-cluster \
            --service ManagementService --force-new-deployment

          aws ecs update-service --cluster feature-flags-cluster \
            --service ReadService --force-new-deployment

          echo "🚀 Déploiement ECS forcé déclenché pour les deux services."
